[project]
name = "coldreach"
version = "0.1.0"
description = "Find recruiters and founders, draft short personal cold emails, review them, then send."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
coldreach = "coldreach.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coldreach"]
